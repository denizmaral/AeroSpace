name: Bug report
description: Something doesn't tile, focus jumps, a shortcut doesn't fire…
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this! The more of the details below you can share, the faster it gets fixed.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or a screen recording
      description: Especially for anything about windows or the settings window. A screenshot of the relevant settings pane helps too (the settings file is binary, there is no config to paste).
  - type: textarea
    id: debug-windows
    attributes:
      label: Output of `aerospace debug-windows`
      description: If a window is handled wrongly.
      render: text
  - type: input
    id: version
    attributes:
      label: MarSpace version
      description: The output of `aerospace --version`.
  - type: input
    id: macos
    attributes:
      label: macOS version
